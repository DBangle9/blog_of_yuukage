<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · Yuukage{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title }}"><meta property="og:description" content="{{ .Description | default site.Params.description }}"><meta property="og:url" content="{{ .Permalink }}"><meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}"><meta property="og:image" content="{{ "images/portrait.webp" | absURL }}">
  <meta name="theme-color" content="#f4f2f8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0e22" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="alternate" type="application/rss+xml" title="Yuukage 博客" href="/posts/index.xml">
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('yuukage-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  <link rel="stylesheet" href="/css/site.css">
  <script defer src="/js/site.js"></script>
</head>
<body class="{{ if .IsHome }}is-home{{ end }}">
<div class="sky" aria-hidden="true"><div class="sky-stars"></div><div class="sky-glow"></div></div>
<a class="skip-link" href="#main">跳到正文</a>
<header class="site-header">
  <div class="wrap header-inner">
  <a class="brand" href="/" aria-label="夕影的blog 首页"><img class="brand-icon" src="/images/stamp-no.webp" alt="" width="40" height="42"><span>夕影的blog<small>YUUKAGE.COM</small></span></a>
  <nav aria-label="主导航">
  {{ $current := .Section }}
  <a href="/" {{ if .IsHome }}aria-current="page"{{ end }}>首页</a><a href="/posts/" {{ if eq $current "posts" }}aria-current="page"{{ end }}>文章</a><a href="/projects/" {{ if eq $current "projects" }}aria-current="page"{{ end }}>项目</a><a href="/about/" {{ if eq $current "about" }}aria-current="page"{{ end }}>关于</a>
  </nav>
  <div class="header-tools"><a class="icon-button" href="/search/" aria-label="搜索文章"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></a><button class="icon-button" id="theme-toggle" aria-label="切换深色模式" aria-pressed="false" hidden><svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button></div>
  </div>
</header>
<main id="main" class="wrap">{{ block "main" . }}{{ end }}</main>
<footer class="site-footer"><div class="wrap footer-inner"><div><a class="footer-brand" href="/">yuukage<span>.</span></a><p class="footer-tagline">On the silent sea, stars shine.<br><span lang="ja">静かな海に、星が降る。</span></p></div><div class="footer-right"><div class="footer-links"><a href="/posts/index.xml">RSS 订阅 ↗</a><a href="/creative/">创作归档 ↗</a>{{ with site.Params.github }}<a href="{{ . }}" rel="me">GitHub ↗</a>{{ end }}</div><p>© {{ now.Year }} Yuukage · Built with Hugo</p></div></div></footer>
</body></html>
