{{ define "main" }}
<header class="page-heading"><p class="eyebrow">{{ if eq .Section "creative" }}CREATIVE ARCHIVE{{ else }}THE JOURNAL{{ end }}</p><h1>{{ .Title }}</h1><div class="page-intro">{{ .Content }}</div></header>
{{ if eq .Section "posts" }}<div class="archive-tools"><a class="pill" href="/search/">⌕ 搜索文章</a><a class="pill" href="/tags/">浏览标签</a><a class="pill" href="/posts/index.xml">RSS 订阅 ↗</a></div>{{ end }}
<section class="archive">{{ range .Pages.ByDate.Reverse }}{{ partial "post-row.html" . }}{{ else }}<p class="empty">这里还没有文章。</p>{{ end }}</section>
{{ end }}
