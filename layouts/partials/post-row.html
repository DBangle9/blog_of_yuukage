<article class="post-row">
<div class="post-date">{{ .Date.Format "2006.01.02" }}<span>{{ .ReadingTime }} 分钟阅读</span></div>
<div class="post-copy"><div class="post-tags">{{ range .GetTerms "categories" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | default (.Summary | plainify) }}</p></div>
<a class="row-arrow" href="{{ .RelPermalink }}" aria-label="阅读 {{ .Title }}">↗</a>
</article>
