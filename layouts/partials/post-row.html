<article class="post-row{{ if .Params.novel }} is-novel{{ end }}">
<div class="post-date"><span class="post-day">{{ .Date.Format "02" }}</span>{{ .Date.Format "2006.01" }}<span>{{ .ReadingTime }} 分钟阅读</span></div>
<div class="post-copy"><div class="post-tags">{{ range .GetTerms "categories" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div><h3><a class="stretched" href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | default (.Summary | plainify) }}</p></div>
<span class="row-arrow" aria-hidden="true">↗</span>
</article>
